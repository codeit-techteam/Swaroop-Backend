services:
  postgres:
    image: postgres:16-alpine
    container_name: swaroop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swaroop
    ports:
      - '5433:5432'
    volumes:
      - swaroop_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d swaroop']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swaroop-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/swaroop?schema=public
    ports:
      - '3000:3000'
    profiles:
      - full

volumes:
  swaroop_pg_data:
